<!DOCTYPE html>
<html>
<body>
<h1>Beamblade Shortener</h1>

<input id="url" placeholder="https://example.com" style="width:300px;">
<button onclick="shorten()">Shorten</button>

<p id="result"></p>

<script>
async function shorten() {
  const url = document.getElementById("url").value;

  if (!url) {
    alert("Paste a URL first");
    return;
  }

  try {
    const res = await fetch("/api/new?url=" + encodeURIComponent(url));

    const text = await res.text(); // safer than .json()

    document.getElementById("result").innerHTML = text;
  } catch (e) {
    document.getElementById("result").innerText =
      "Error calling API (check Vercel deployment)";
  }
}
</script>
</body>
</html>
